services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    # Start from the autosaved API config, or from an empty config on first run.
    command: sh -c "caddy run --resume || caddy run"
    environment:
      # Bind the admin API inside the compose network only. Never publish 2019.
      CADDY_ADMIN: 0.0.0.0:2019
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - caddyweb

  caddyweb:
    image: docker-registry.evoxy.de/caddyweb:0.7.0
    restart: unless-stopped
    environment:
      PORT: "18080"
      CADDY_ADMIN_URL: http://caddy:2019
      CADDY_HTTP_PORT: "80"
      CADDY_HTTPS_PORT: "443"
      APP_USERNAME: ${APP_USERNAME:-admin}
      APP_PASSWORD: ${APP_PASSWORD:?Set APP_PASSWORD before starting}
      AUTH_SECRET: ${AUTH_SECRET:-}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      APP_URL: ${APP_URL:-}
      CADDYWEB_DATA_DIR: /app/data
      CADDYWEB_BASE_DOMAIN: ${CADDYWEB_BASE_DOMAIN:-}
      OIDC_ISSUER_URL: ${OIDC_ISSUER_URL:-}
      OIDC_CLIENT_ID: ${OIDC_CLIENT_ID:-}
      OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET:-}
      OIDC_PROVIDER_NAME: ${OIDC_PROVIDER_NAME:-Authentik}
      OIDC_SCOPES: ${OIDC_SCOPES:-openid profile email}
      OIDC_ALLOWED_USERS: ${OIDC_ALLOWED_USERS:-}
      OIDC_ALLOWED_GROUPS: ${OIDC_ALLOWED_GROUPS:-}
      OIDC_TOKEN_AUTH_METHOD: ${OIDC_TOKEN_AUTH_METHOD:-basic}
      OIDC_REDIRECT_URI: ${OIDC_REDIRECT_URI:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURITY: ${SMTP_SECURITY:-starttls}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM_EMAIL: ${SMTP_FROM_EMAIL:-}
      SMTP_FROM_NAME: ${SMTP_FROM_NAME:-CaddyWeb}
      SMTP_REPLY_TO: ${SMTP_REPLY_TO:-}
      SMTP_REJECT_UNAUTHORIZED: ${SMTP_REJECT_UNAUTHORIZED:-true}
    volumes:
      - caddyweb_data:/app/data
    ports:
      # Host port is configurable; the container always listens on 18080.
      - "${CADDYWEB_PORT:-18080}:18080"
    depends_on:
      - caddy
    networks:
      - caddyweb

volumes:
  caddy_data:
  caddy_config:
  caddyweb_data:

networks:
  caddyweb:
