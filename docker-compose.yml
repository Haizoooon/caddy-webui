services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    # Start from the autosaved API config, or from an empty config on first run.
    command: sh -c "caddy run --resume || caddy run"
    environment:
      # Bind the admin API inside the compose network only. Never publish 2019.
      CADDY_ADMIN: 0.0.0.0:2019
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - caddyweb

  caddyweb:
    image: docker-registry.evoxy.de/caddyweb:0.4.0
    restart: unless-stopped
    environment:
      PORT: "18080"
      CADDY_ADMIN_URL: http://caddy:2019
      CADDY_HTTP_PORT: "80"
      CADDY_HTTPS_PORT: "443"
      APP_USERNAME: ${APP_USERNAME:-admin}
      APP_PASSWORD: ${APP_PASSWORD:?Set APP_PASSWORD before starting}
      AUTH_SECRET: ${AUTH_SECRET:-}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
    ports:
      # Host port is configurable; the container always listens on 18080.
      - "${CADDYWEB_PORT:-18080}:18080"
    depends_on:
      - caddy
    networks:
      - caddyweb

volumes:
  caddy_data:
  caddy_config:

networks:
  caddyweb:
